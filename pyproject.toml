[project]
name = "peft-lora-eval"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.10.1",
    "bitsandbytes>=0.47.0",
    "colorlog>=6.9.0",
    "datasets>=4.1.1",
    "evaluate>=0.4.6",
    "nvidia-ml-py>=13.580.82",
    "peft>=0.17.1",
    "pytest>=8.4.2",
    "pyyaml>=6.0.2",
    "scikit-learn>=1.7.2",
    "torch>=2.8.0",
    "transformers>=4.56.2",
    "wandb>=0.22.0",
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cu126" },
]
torchvision = [
  { index = "pytorch-cu126"},
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
